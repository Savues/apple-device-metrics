name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consistency checks (includes forecast regeneration)
        run: python3 scripts/verify.py

      - name: Internal Markdown links
        run: python3 scripts/check_links.py

      - name: Translations mirror the English originals
        run: python3 scripts/check_i18n.py

      # The pages workflow only builds on main; catch a broken build (or a JS
      # syntax error) on the pull request instead.
      - name: Site builds and the front-end parses
        run: |
          python3 scripts/build_site.py
          node --check site/app.js
          node --check site/i18n.js

      - name: No raw analytics or diary files committed
        run: |
          bad=$(git ls-files | grep -Ei '\.ips($|\.)|raw.*\.txt$|diary.*\.txt$|_private' || true)
          if [ -n "$bad" ]; then echo "Raw source files committed:"; echo "$bad"; exit 1; fi

      - name: No identifier-like keys in published data
        run: |
          if git grep -nE '"(deviceId|uuid|incident_id|configUuid|carrier|productSku|serialNumber|ChemID)"' -- devices docs; then
            echo "Identifier-like key found in published data"; exit 1
          fi
